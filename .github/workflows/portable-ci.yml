name: Portable CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  portable:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11.9
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: 3.11.9

      - name: Install hash-locked dependencies
        id: install
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.sha256.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .

      - name: Verify dependency environment
        id: dependencies
        shell: pwsh
        run: |
          $evidenceDir = Join-Path $env:RUNNER_TEMP 'portable-ci-evidence'
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          python -m pip check
          python -m pip freeze --all | Set-Content -LiteralPath (Join-Path $evidenceDir 'environment.txt') -Encoding utf8

      - name: Check changed-file whitespace
        id: whitespace
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ($env:EVENT_NAME -eq 'pull_request') {
            git diff --check "$env:BASE_SHA...$env:SOURCE_SHA"
          } else {
            git diff --check "$env:SOURCE_SHA^...$env:SOURCE_SHA"
          }

      - name: Run portable test population
        id: tests
        shell: pwsh
        run: |
          $evidenceDir = Join-Path $env:RUNNER_TEMP 'portable-ci-evidence'
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          python -m pytest -q -m "not local_evidence" --junitxml="$evidenceDir\pytest-junit.xml"

      - name: Build run evidence
        if: always()
        shell: pwsh
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          DEPENDENCY_OUTCOME: ${{ steps.dependencies.outcome }}
          WHITESPACE_OUTCOME: ${{ steps.whitespace.outcome }}
          PYTEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          $evidenceDir = Join-Path $env:RUNNER_TEMP 'portable-ci-evidence'
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          $junitPath = Join-Path $evidenceDir 'pytest-junit.xml'
          $environmentPath = Join-Path $evidenceDir 'environment.txt'
          $evidence = [ordered]@{
            schema_version = 1
            repository = $env:GITHUB_REPOSITORY
            source_sha = $env:SOURCE_SHA
            tree_sha = (git rev-parse "$env:SOURCE_SHA^{tree}").Trim()
            workflow_ref = $env:GITHUB_WORKFLOW_REF
            workflow_sha = $env:GITHUB_WORKFLOW_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = [int]$env:GITHUB_RUN_ATTEMPT
            event_name = $env:GITHUB_EVENT_NAME
            runner_os = $env:RUNNER_OS
            python_version = (python --version 2>&1).ToString().Trim()
            requirements_lock_sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath 'requirements.sha256.lock').Hash.ToLowerInvariant()
            install_outcome = $env:INSTALL_OUTCOME
            dependency_outcome = $env:DEPENDENCY_OUTCOME
            whitespace_outcome = $env:WHITESPACE_OUTCOME
            pytest_outcome = $env:PYTEST_OUTCOME
            junit_sha256 = if (Test-Path -LiteralPath $junitPath) {
              (Get-FileHash -Algorithm SHA256 -LiteralPath $junitPath).Hash.ToLowerInvariant()
            } else {
              $null
            }
            environment_sha256 = if (Test-Path -LiteralPath $environmentPath) {
              (Get-FileHash -Algorithm SHA256 -LiteralPath $environmentPath).Hash.ToLowerInvariant()
            } else {
              $null
            }
            completed_at_utc = [DateTime]::UtcNow.ToString('o')
          }
          $evidence |
            ConvertTo-Json -Depth 4 |
            Set-Content -LiteralPath (Join-Path $evidenceDir 'portable-ci-evidence.json') -Encoding utf8

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portable-ci-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}\portable-ci-evidence
          if-no-files-found: error
          retention-days: 90
